name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy engine rules ai
      - name: Pytest
        # needs_shop_standards tests fail by design until real shop values replace
        # the placeholders in standards/. Remove this deselect once they are in.
        run: pytest -q -m "not needs_shop_standards"
